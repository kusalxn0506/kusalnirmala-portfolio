<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vote — PechaKucha 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,400&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   MOBILE VOTING APP — PECHAKUCHA 2026
   ═══════════════════════════════════════════════════ */
:root {
  --bg: #08060a;
  --surface: #141118;
  --surface-hover: #1f1a24;
  --text: #ffffff;
  --text-dim: #9b94a8;
  --gold: #fce373;
  --accent: #ff4d4d;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 20px;
}

.header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
.title { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 600; margin-bottom: 8px; }
.title .accent { color: var(--gold); }
.subtitle { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }

/* Grid Layout for Participants */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 15px;
  max-width: 600px;
  margin: 0 auto;
  padding-bottom: 40px;
}

/* Participant Card */
.card {
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 15px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s, border-color 0.2s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.card:active { transform: scale(0.96); background: var(--surface-hover); border-color: rgba(252,227,115,0.3); }

.card-img-wrap {
  width: 80px; height: 80px;
  margin: 0 auto 12px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.1);
  transition: border-color 0.3s;
}
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.card:active .card-img-wrap { border-color: var(--gold); }

.card-name { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; line-height: 1.2; }

/* Success & Lockout States */
.state-message {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; text-align: center;
}
.state-icon { font-size: 4rem; margin-bottom: 20px; }
.state-title { font-family: 'Fraunces', serif; font-size: 2rem; color: var(--gold); margin-bottom: 10px; }
.state-desc { color: var(--text-dim); font-size: 1.1rem; line-height: 1.5; max-width: 300px; }
.state-locked .state-title { color: var(--accent); }

/* ═══════════════ STUDENT ID MODAL ═══════════════ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(5, 3, 10, 0.8);
  backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-content {
  background: linear-gradient(145deg, rgba(30, 26, 36, 0.9), rgba(20, 17, 24, 0.9));
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px; padding: 30px 24px; width: 90%; max-width: 360px;
  text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.modal-overlay.active .modal-content { transform: translateY(0); }

.modal-title { font-family: 'Fraunces', serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 10px; }
.modal-desc { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.4; }

.modal-input {
  width: 100%; padding: 16px; border-radius: 12px;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-family: 'IBM Plex Sans', sans-serif; font-size: 1.1rem;
  text-align: center; outline: none; transition: border-color 0.3s;
  margin-bottom: 24px;
}
.modal-input:focus { border-color: var(--gold); }
.modal-input::placeholder { color: rgba(255,255,255,0.2); }

.modal-actions { display: flex; gap: 12px; }
.btn {
  flex: 1; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 1rem;
  border: none; cursor: pointer; transition: opacity 0.2s, transform 0.1s;
}
.btn:active { transform: scale(0.96); }
.btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
.btn-confirm { background: linear-gradient(135deg, var(--gold), #ffca28); color: #000; }
.btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

</style>
</head>
<body>

<div class="header">
  <div class="subtitle">Live Audience Voting</div>
  <h1 class="title">Pecha<span class="accent">Kucha</span></h1>
</div>

<!-- Main Voting Grid -->
<div class="grid" id="votingGrid"></div>

<!-- Success Message (Shown after voting) -->
<div class="state-message" id="successState">
  <div class="state-icon">✅</div>
  <div class="state-title">Vote Cast!</div>
  <div class="state-desc">Your vote has been sent directly to the projector. Keep your eyes on the screen!</div>
</div>

<!-- Locked Message (Shown when admin closes voting) -->
<div class="state-message state-locked" id="lockedState">
  <div class="state-icon">🔒</div>
  <div class="state-title">Voting Closed</div>
  <div class="state-desc">The countdown has ended. Voting is no longer accepting new submissions.</div>
</div>

<!-- Student ID Modal -->
<div class="modal-overlay" id="voteModal">
  <div class="modal-content">
    <h3 class="modal-title" id="modalTitle">Confirm Vote</h3>
    <p class="modal-desc">Please enter your NSBM Student ID to cast your official vote.</p>
    <input type="text" class="modal-input" id="studentIdInput" placeholder="e.g. 10012345" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-confirm" id="confirmVoteBtn">Submit Vote</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyA9Tdj5TUnaN67thSjkDIjUHB00zQTDXJ4",
  authDomain: "pechakucha-nsbm.firebaseapp.com",
  projectId: "pechakucha-nsbm",
  storageBucket: "pechakucha-nsbm.firebasestorage.app",
  messagingSenderId: "188251897901",
  appId: "1:188251897901:web:d579281f4689db24fcb8a4"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* PARTICIPANTS */
const participants = [
  { id: "p1", name: "Kusal Nirmala", image: "assets/portrait.jpg" },
  { id: "p2", name: "Amara Perera", image: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=100&h=100&fit=crop&crop=face" },
  { id: "p3", name: "Dineth Silva", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=face" },
  { id: "p4", name: "Nethmi Fernando", image: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&h=100&fit=crop&crop=face" },
  { id: "p5", name: "Ravindu Jayasekara", image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop&crop=face" }
];

let votingLocked = true; // Locked by default until config loads
let pendingVoteId = null;
const grid = document.getElementById('votingGrid');
const lockedState = document.getElementById('lockedState');
const successState = document.getElementById('successState');

/* RENDER GRID */
participants.forEach(p => {
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => openModal(p.id, p.name);
  card.innerHTML = `
    <div class="card-img-wrap"><img src="${p.image}" alt="${p.name}"></div>
    <div class="card-name">${p.name}</div>
  `;
  grid.appendChild(card);
});

/* MODAL LOGIC */
window.openModal = function(pId, pName) {
  if (votingLocked) return;
  pendingVoteId = pId;
  document.getElementById('modalTitle').textContent = `Vote for ${pName}`;
  document.getElementById('studentIdInput').value = '';
  document.getElementById('voteModal').classList.add('active');
  setTimeout(() => document.getElementById('studentIdInput').focus(), 100);
}

window.closeModal = function() {
  document.getElementById('voteModal').classList.remove('active');
  pendingVoteId = null;
}

document.getElementById('confirmVoteBtn').addEventListener('click', async () => {
  const studentId = document.getElementById('studentIdInput').value.trim();
  
  if (!studentId || studentId.length < 4) {
    alert("Please enter a valid Student ID.");
    return;
  }
  
  const btn = document.getElementById('confirmVoteBtn');
  btn.disabled = true;
  btn.textContent = "Sending...";

  try {
    // SECURITY MAGIC: We use the studentId as the document name in Firestore.
    // If they vote again, it overwrites their previous vote instead of adding a new one!
    // Total votes on projector will remain perfectly accurate.
    await setDoc(doc(db, "votes", studentId), {
      participantId: pendingVoteId,
      studentId: studentId,
      timestamp: new Date()
    });
    
    closeModal();
    grid.style.display = 'none';
    successState.style.display = 'flex';
  } catch (error) {
    console.error("Error casting vote: ", error);
    alert("Failed to connect. Please try again.");
    btn.disabled = false;
    btn.textContent = "Submit Vote";
  }
});

/* REAL-TIME LOCKOUT LISTENER */
onSnapshot(doc(db, "config", "voting"), (docSnap) => {
  if (docSnap.exists()) {
    const data = docSnap.data();
    votingLocked = data.open === false;
    
    if (votingLocked) {
      grid.style.display = 'none';
      successState.style.display = 'none';
      lockedState.style.display = 'flex';
      closeModal(); // Force close modal if time runs out while typing
    } else if (successState.style.display !== 'flex') {
      // Only show grid if they haven't already voted successfully
      grid.style.display = 'grid';
      lockedState.style.display = 'none';
    }
  }
}, (error) => {
  console.error("Error listening to config:", error);
});
</script>
</body>
</html>
