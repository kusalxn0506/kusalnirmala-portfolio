<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not Found — Kusal Nirmala</title>
<meta name="theme-color" content="#17140f">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17140f; --paper:#f4ead9; --text-dim:#b6ab95; --gold:#b6913f; --gold-bright:#d4af5f; --seal:#a8402f; --line:rgba(244,234,217,0.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--ink); color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:32px; position:relative; overflow:hidden;
  }
  .kanji{
    position:absolute; font-family:'Fraunces', serif; font-size:min(70vw,560px); color:var(--paper);
    opacity:0.045; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; line-height:1;
  }
  .content{ position:relative; z-index:1; max-width:440px; }
  .code{ font-family:'Fraunces', serif; font-weight:900; font-size:clamp(4rem,14vw,7rem); color:var(--paper); line-height:1; }
  .line{ margin-top:18px; font-size:15px; color:var(--text-dim); line-height:1.7; }
  .btn{
    display:inline-flex; margin-top:32px; padding:14px 26px; border:1px solid var(--gold);
    color:var(--gold-bright); font-size:13px; letter-spacing:0.06em; text-transform:uppercase;
    text-decoration:none; border-radius:2px; transition:background .25s, color .25s;
  }
  .btn:hover{ background:var(--seal); border-color:var(--seal); color:var(--paper); }

  @media (pointer: fine){
    body, a, .btn{ cursor:none; }
  }
  .cursor-dot{
    position:fixed; top:0; left:0; width:6px; height:6px; border-radius:50%;
    background:var(--gold-bright); pointer-events:none; z-index:9999;
    transform:translate(-50%,-50%); opacity:0; transition:opacity .2s;
  }
  .cursor-ring{
    position:fixed; top:0; left:0; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--gold-bright); pointer-events:none; z-index:9998;
    transform:translate(-50%,-50%); opacity:0;
    transition:width .25s cubic-bezier(.45,0,.2,1), height .25s cubic-bezier(.45,0,.2,1), opacity .2s;
  }
  .cursor-dot.active{ opacity:1; }
  .cursor-ring.active{ opacity:0.5; }
  .cursor-ring.hover{ width:50px; height:50px; opacity:0.85; }
</style>
</head>
<body>
  <div class="kanji" aria-hidden="true">型</div>
  <div class="content">
    <div class="code">404</div>
    <p class="line">This page hasn't taken form yet — wrong stance, or the link moved.</p>
    <a href="index.html" class="btn">Back to Portfolio</a>
  </div>
<script>
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion && window.matchMedia('(pointer:fine)').matches){
    var cdot = document.createElement('div'); cdot.className = 'cursor-dot';
    var cring = document.createElement('div'); cring.className = 'cursor-ring';
    document.body.appendChild(cdot);
    document.body.appendChild(cring);
    var cmx = window.innerWidth/2, cmy = window.innerHeight/2, crx = cmx, cry = cmy;
    window.addEventListener('mousemove', function(e){
      cmx = e.clientX; cmy = e.clientY;
      cdot.style.left = cmx + 'px'; cdot.style.top = cmy + 'px';
      cdot.classList.add('active'); cring.classList.add('active');
    });
    document.addEventListener('mouseleave', function(){ cdot.classList.remove('active'); cring.classList.remove('active'); });
    (function cloop(){
      crx += (cmx - crx) * 0.18; cry += (cmy - cry) * 0.18;
      cring.style.left = crx + 'px'; cring.style.top = cry + 'px';
      requestAnimationFrame(cloop);
    })();
    document.querySelectorAll('a, .btn').forEach(function(el){
      el.addEventListener('mouseenter', function(){ cring.classList.add('hover'); });
      el.addEventListener('mouseleave', function(){ cring.classList.remove('hover'); });
    });
  }
</script>
</body>
</html>
